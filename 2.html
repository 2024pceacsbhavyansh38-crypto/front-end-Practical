<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JavaScript Quiz</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .quiz-container {
            width: 90%;
            max-width: 600px;

            background: white;

            padding: 35px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        .question-number {
            color: #777;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .question {
            font-size: 20px;
            font-weight: bold;

            margin-bottom: 20px;
        }

        .option {
            display: block;

            border: 1px solid #ddd;

            padding: 13px;

            margin: 10px 0;

            border-radius: 7px;

            cursor: pointer;

            transition: 0.2s;
        }

        .option:hover {
            background: #f1f5f9;
        }

        .option input {
            margin-right: 10px;
        }

        .next-btn,
        .restart-btn {
            margin-top: 20px;

            border: none;

            background: #007bff;

            color: white;

            padding: 11px 25px;

            border-radius: 6px;

            cursor: pointer;

            font-size: 15px;
        }

        .next-btn:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .next-btn:hover:not(:disabled),
        .restart-btn:hover {
            background: #0056b3;
        }

        .result {
            text-align: center;
        }

        .score {
            font-size: 45px;
            font-weight: bold;
            color: #333;

            margin: 20px 0;
        }

        .message {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .hidden {
            display: none;
        }

    </style>
</head>

<body>

<div class="quiz-container">

    <h1>JavaScript Quiz</h1>

    <!-- Quiz Section -->

    <div id="quizSection">

        <div id="questionNumber"
             class="question-number">
        </div>

        <div id="question"
             class="question">
        </div>

        <div id="options">
        </div>

        <button id="nextBtn"
                class="next-btn"
                disabled>
            Next
        </button>

    </div>


    <!-- Result Section -->

    <div id="resultSection"
         class="result hidden">

        <div class="score"
             id="score">
        </div>

        <div class="message"
             id="message">
        </div>

        <button class="restart-btn"
                onclick="restartQuiz()">
            Restart Quiz
        </button>

    </div>

</div>


<script>

    // Array of question objects

    const questions = [

        {
            question:
                "Which keyword declares a constant variable?",

            options: [
                "var",
                "let",
                "const",
                "static"
            ],

            answer: 2
        },


        {
            question:
                "Which method is used to select an HTML element by ID?",

            options: [
                "getElementById()",
                "queryHTML()",
                "selectById()",
                "getElement()"
            ],

            answer: 0
        },


        {
            question:
                "Which symbol is used for strict equality in JavaScript?",

            options: [
                "=",
                "==",
                "===",
                "!="
            ],

            answer: 2
        },


        {
            question:
                "Which keyword is used to create a function?",

            options: [
                "function",
                "method",
                "define",
                "func"
            ],

            answer: 0
        }

    ];


    let currentQuestion = 0;

    let score = 0;


    // Get HTML elements

    const questionNumber =
        document.getElementById("questionNumber");

    const questionElement =
        document.getElementById("question");

    const optionsElement =
        document.getElementById("options");

    const nextBtn =
        document.getElementById("nextBtn");


    // Show current question

    function showQuestion() {

        let q = questions[currentQuestion];

        questionNumber.textContent =
            `Question ${currentQuestion + 1} of ${questions.length}`;

        questionElement.textContent =
            q.question;

        optionsElement.innerHTML = "";

        nextBtn.disabled = true;

        nextBtn.textContent =
            currentQuestion === questions.length - 1
            ? "Finish"
            : "Next";


        // Create radio buttons

        q.options.forEach((option, index) => {

            let label = document.createElement("label");

            label.className = "option";

            label.innerHTML = `

                <input
                    type="radio"
                    name="answer"
                    value="${index}">

                ${option}

            `;

            optionsElement.appendChild(label);

        });


        // Enable Next after selecting answer

        const radioButtons =
            document.querySelectorAll(
                'input[name="answer"]'
            );

        radioButtons.forEach(radio => {

            radio.addEventListener("change", () => {

                nextBtn.disabled = false;

            });

        });

    }


    // Next / Finish button

    nextBtn.addEventListener("click", function () {

        const selected =
            document.querySelector(
                'input[name="answer"]:checked'
            );

        if (!selected) {
            return;
        }

        let selectedAnswer =
            Number(selected.value);

        let correctAnswer =
            questions[currentQuestion].answer;


        // Check answer

        if (selectedAnswer === correctAnswer) {
            score++;
        }


        // Move to next question

        currentQuestion++;


        if (currentQuestion < questions.length) {

            showQuestion();

        } else {

            showResult();

        }

    });


    // Show result

    function showResult() {

        document.getElementById("quizSection")
            .classList.add("hidden");

        document.getElementById("resultSection")
            .classList.remove("hidden");


        let percentage =
            (score / questions.length) * 100;


        document.getElementById("score")
            .textContent =
            `${score} / ${questions.length}`;


        let message = "";


        if (percentage === 100) {

            message = `You scored 100%. Excellent work!`;

        }
        else if (percentage >= 50) {

            message =
                `You scored ${percentage}%. Good job!`;

        }
        else {

            message =
                `You scored ${percentage}%. Keep practicing!`;

        }


        document.getElementById("message")
            .textContent = message;

    }


    // Restart quiz

    function restartQuiz() {

        currentQuestion = 0;

        score = 0;

        document.getElementById("quizSection")
            .classList.remove("hidden");

        document.getElementById("resultSection")
            .classList.add("hidden");

        showQuestion();

    }


    // Start quiz

    showQuestion();

</script>

</body>
</html>
